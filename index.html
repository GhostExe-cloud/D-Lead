<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProVoid | Secure Download</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030303;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* Background Effects */
        #snow-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, transparent 70%); z-index: -1; }

        /* Download Card */
        .download-card {
            width: 90%;
            max-width: 450px;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid var(--border);
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }

        .file-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.8; }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -1px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 2.5rem; }

        /* Loading Bar System */
        .loading-container { display: none; margin-bottom: 2rem; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .bar-fill { width: 0%; height: 100%; background: #fff; box-shadow: 0 0 15px #fff; transition: width 0.1s linear; }
        .status-text { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
        }
        .btn-verify { background: #fff; color: #000; }
        .btn-verify:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        
        .btn-ready { 
            background: transparent; 
            border: 1px solid #fff; 
            color: #fff; 
            display: none; 
            text-decoration: none;
        }
        .btn-ready:hover { background: #fff; color: #000; }

        /* Checkbox Styling */
        .verify-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .verify-box:hover { background: rgba(255,255,255,0.06); }
        .checkbox { width: 20px; height: 20px; border: 2px solid #444; border-radius: 4px; position: relative; }
        .checkbox.checked { background: #fff; border-color: #fff; }
        .checkbox.checked::after { content: '✓'; color: #000; font-size: 14px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>
    <div class="bg-glow"></div>

    <div class="download-card">
        <div class="file-icon">📦</div>
        <h1>ProVoid_v2.0.4.zip</h1>
        <p>Size: 14.2 MB • Secure Cloud Distribution</p>

        <div id="verify-step">
            <div class="verify-box" onclick="toggleCheck()">
                <div class="checkbox" id="check-ui"></div>
                <span style="font-size: 0.85rem; color: #bbb;">I am not a robot</span>
            </div>
            <button class="btn btn-verify" onclick="startDownload()">Start Verification</button>
        </div>

        <div class="loading-container" id="loading-step">
            <div class="bar-bg">
                <div class="bar-fill" id="progress"></div>
            </div>
            <div class="status-text" id="status">Connecting to server...</div>
        </div>

        <a href="YOUR_DIRECT_FILE_URL_HERE" class="btn btn-ready" id="final-btn">
            Download Now
        </a>
    </div>

    <script>
        // --- SNOW ANIMATION ---
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initSnow() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.2 });
            }
        }
        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.beginPath();
            particles.forEach(p => {
                ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                p.y += p.speed; if (p.y > canvas.height) p.y = -5;
            });
            ctx.fill(); requestAnimationFrame(drawSnow);
        }
        window.addEventListener('resize', initSnow);
        initSnow(); drawSnow();

        // --- DOWNLOAD LOGIC ---
        let isChecked = false;

        function toggleCheck() {
            isChecked = !isChecked;
            document.getElementById('check-ui').classList.toggle('checked');
        }

        function startDownload() {
            if(!isChecked) {
                alert("Please verify that you are not a robot.");
                return;
            }

            // Hide verify step, show loading
            document.getElementById('verify-step').style.display = 'none';
            document.getElementById('loading-step').style.display = 'block';

            let progress = 0;
            const bar = document.getElementById('progress');
            const status = document.getElementById('status');
            
            const messages = [
                "Establishing secure tunnel...",
                "Bypassing node congestion...",
                "Decrypting file headers...",
                "Finalizing package...",
                "Ready for transfer."
            ];

            const interval = setInterval(() => {
                progress += Math.random() * 2;
                if (progress > 100) progress = 100;
                
                bar.style.width = progress + "%";
                
                // Update text based on percentage
                if (progress > 80) status.innerText = messages[4];
                else if (progress > 60) status.innerText = messages[3];
                else if (progress > 40) status.innerText = messages[2];
                else if (progress > 20) status.innerText = messages[1];

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-step').style.display = 'none';
                        document.getElementById('final-btn').style.display = 'flex';
                    }, 500);
                }
            }, 50);
        }
    </script>
</body>
</html>
